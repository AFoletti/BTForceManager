services:
  backend:
    build:
      # Build context is the repo root (not ./backend) so the Dockerfile can
      # also COPY the sibling top-level data/ folder (downtime-actions.json,
      # achievements.json, sp-choices.json, mek_catalog.csv, forces/*.json) -
      # domain/downtime_logic.py and the import_*.py seed scripts resolve
      # that folder relative to their own file location and need it present
      # inside the image at the same relative depth as in this repo.
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env.docker
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # Bind-mounted (not a named Docker volume) so the SQLite database file
      # is a real file under this host path - browsable/backupable directly
      # from DSM File Station, not hidden inside Docker's internal storage.
      - ${DB_DATA_PATH:-./docker-data/db}:/data
      # Dedicated "drop zone" for the Phase 7 watched-folder auto-import:
      # copy/drag a mech catalog CSV into this host folder and it gets
      # imported automatically within a few seconds. Separate from the DB
      # folder above so it can be pointed at a more convenient/shared path.
      - ${MECH_CATALOG_WATCH_HOST_DIR:-./docker-data/mech-catalog-drop}:/watch
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      # Same reasoning as the backend: build context is the repo root so the
      # Dockerfile can copy the top-level data/ folder in place of the
      # public/data symlink (which points outside a ./frontend-only context
      # and would otherwise be a dangling symlink in the built image).
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
