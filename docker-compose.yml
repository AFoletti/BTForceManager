services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env.docker
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # Bind-mount the repo's own data/ folder (which includes the
      # committed, pre-populated data/btforce.db) directly - the container
      # sees the live DB at /data/btforce.db with no separate host-only
      # "example vs live" DB location.
      - ./data:/data
      # Dedicated "drop zone" for the Phase 7 watched-folder auto-import:
      # copy/drag a mech catalog CSV into this host folder and it gets
      # imported automatically within a few seconds. Separate from the DB
      # folder above so it can be pointed at a more convenient/shared path.
      - ${MECH_CATALOG_WATCH_HOST_DIR:-./docker-data/mech-catalog-drop}:/watch
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      # Build context is the repo root so this compose file's own volume
      # mount for the backend (./data) and this Dockerfile can both resolve
      # relative to the same root; the frontend image itself no longer
      # copies anything from data/ (Issue 6 - no JSON/CSV data files ship
      # with the frontend, catalog lookups go through the backend API).
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
