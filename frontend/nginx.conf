server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward every /api/* request to the backend container. Keeping this on
    # the same origin/port as the UI means the built frontend never needs to
    # know the NAS's IP/hostname - it just calls relative "/api/..." paths.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router / SPA fallback - any unmatched path serves index.html so
    # client-side routing keeps working after a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
